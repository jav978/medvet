services:
  medvet-postgres:
    image: postgres:18-alpine
    container_name: medvet-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: medvet
      POSTGRES_USER: medvet_admin
      POSTGRES_PASSWORD: medvet_secret_2026
    volumes:
      - medvet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medvet_admin -d medvet"]
      interval: 10s
      timeout: 5s
      retries: 5

  medvet-redis:
    image: redis:7-alpine
    container_name: medvet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - medvet_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  medvet-pgadmin:
    image: dpage/pgadmin4
    container_name: medvet-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medvet.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      medvet-postgres:
        condition: service_healthy

  medvet-directus:
    image: directus/directus:latest
    container_name: medvet-directus
    restart: unless-stopped
    ports:
      - "8055:8055"
    environment:
      KEY: medvet-directus-key-2026
      SECRET: medvet-directus-secret-2026
      DB_CLIENT: pg
      DB_HOST: medvet-postgres
      DB_PORT: "5432"
      DB_DATABASE: medvet
      DB_USER: medvet_admin
      DB_PASSWORD: medvet_secret_2026
      ADMIN_EMAIL: admin@medvet.com
      ADMIN_PASSWORD: admin123
    depends_on:
      medvet-postgres:
        condition: service_healthy

volumes:
  medvet_pgdata:
    driver: local
  medvet_redisdata:
    driver: local
