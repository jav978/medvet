<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072e20"/>
      <stop offset="50%" stop-color="#041a12"/>
      <stop offset="100%" stop-color="#020d09"/>
    </linearGradient>

    <!-- Stethoscope Green Gradient -->
    <linearGradient id="stethGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Heart Glow Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="heartInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Dog Colors -->
    <linearGradient id="dogFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dogMuzzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Cat Colors -->
    <linearGradient id="catFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="catMuzzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Metallic Accents -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Shadow filter -->
    <!-- <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter> -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter> -->
  </defs>

  <!-- Squircle Badge Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="107" fill="none" stroke="#00f59b" stroke-width="4" stroke-opacity="0.35"/>
  <rect width="496" height="496" x="8" y="8" rx="107" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle Ambient Glow Behind Stethoscope -->
  <circle cx="256" cy="256" r="170" fill="#00f59b" fill-opacity="0.06" />

  <!-- ==================== ANIMALS GROUP ==================== -->
  <g id="pets" >
    
    <!-- ====== DOG (LEFT) ====== -->
    <g id="dog" transform="translate(115, 175)">
      <!-- Dog Body & Neck -->
      <path d="M-5 130 C-5 95 15 70 45 65 C75 60 95 80 100 130 Z" fill="url(#dogFur)"/>
      <path d="M10 130 C15 105 30 85 50 80 C70 75 85 95 90 130 Z" fill="#fffbeb" fill-opacity="0.85"/>

      <!-- Left Ear (Floppy Back) -->
      <path d="M-15 25 C-30 45 -35 85 -20 105 C-10 115 5 110 5 95 C5 75 -5 40 -15 25 Z" fill="#d97706"/>
      <path d="M-12 35 C-22 50 -26 80 -15 95 C-8 102 0 98 0 88 C0 70 -7 45 -12 35 Z" fill="#b45309"/>

      <!-- Dog Head Base -->
      <ellipse cx="38" cy="40" rx="46" ry="42" fill="url(#dogFur)"/>
      <!-- Forehead highlight -->
      <path d="M22 8 C32 4 45 4 54 8 C48 30 28 30 22 8 Z" fill="#fef3c7"/>

      <!-- Right Ear (Front Floppy) -->
      <path d="M72 20 C92 35 102 75 92 100 C85 112 70 108 68 95 C66 75 68 38 72 20 Z" fill="#d97706"/>
      <path d="M74 30 C88 45 94 75 86 92 C80 98 72 94 70 85 C68 70 70 42 74 30 Z" fill="#b45309"/>

      <!-- Dog Muzzle / Snout -->
      <path d="M15 45 C15 32 60 32 60 45 C65 65 60 85 38 85 C15 85 10 65 15 45 Z" fill="url(#dogMuzzle)"/>
      
      <!-- Dog Nose -->
      <path d="M30 42 C33 38 43 38 46 42 C49 47 45 54 38 54 C31 54 27 47 30 42 Z" fill="#1e293b"/>
      <!-- Nose shine -->
      <ellipse cx="35" cy="43" rx="3" ry="1.5" fill="#94a3b8"/>

      <!-- Dog Mouth & Smile -->
      <path d="M38 54 L38 65 M24 62 C30 68 38 68 38 65 C38 68 46 68 52 62" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Tongue Peeking -->
      <path d="M34 66 C34 74 42 74 42 66 Z" fill="#f43f5e"/>

      <!-- Dog Eyes -->
      <!-- Left Eye -->
      <ellipse cx="20" cy="32" rx="6" ry="7" fill="#1e293b"/>
      <circle cx="18" cy="30" r="2.2" fill="#ffffff"/>
      <circle cx="22" cy="34" r="1" fill="#ffffff"/>
      <path d="M14 23 C17 21 24 22 26 25" stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Right Eye -->
      <ellipse cx="55" cy="32" rx="6" ry="7" fill="#1e293b"/>
      <circle cx="53" cy="30" r="2.2" fill="#ffffff"/>
      <circle cx="57" cy="34" r="1" fill="#ffffff"/>
      <path d="M49 25 C51 22 58 21 61 23" stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Cheerful Cheek Blush -->
      <ellipse cx="10" cy="52" rx="7" ry="4" fill="#f87171" fill-opacity="0.3"/>
      <ellipse cx="66" cy="52" rx="7" ry="4" fill="#f87171" fill-opacity="0.3"/>
    </g>

    <!-- ====== CAT (RIGHT) ====== -->
    <g id="cat" transform="translate(275, 175)">
      <!-- Cat Body & Chest -->
      <path d="M10 130 C15 95 35 75 60 70 C85 75 105 95 110 130 Z" fill="url(#catFur)"/>
      <path d="M35 130 C40 100 50 85 60 82 C70 85 80 100 85 130 Z" fill="#ffffff"/>

      <!-- Cat Left Ear (Perky Triangle) -->
      <path d="M18 35 L5 -8 C18 -10 38 5 40 20 Z" fill="url(#catFur)"/>
      <path d="M20 28 L10 0 C18 -2 30 8 32 18 Z" fill="#fda4af"/> <!-- Inner Ear Pink -->

      <!-- Cat Right Ear (Perky Triangle) -->
      <path d="M80 20 C82 5 102 -10 115 -8 L102 35 Z" fill="url(#catFur)"/>
      <path d="M88 18 C90 8 102 -2 110 0 L100 28 Z" fill="#fda4af"/> <!-- Inner Ear Pink -->

      <!-- Cat Head Base -->
      <ellipse cx="60" cy="42" rx="42" ry="36" fill="url(#catFur)"/>

      <!-- Tabby Stripes on Forehead -->
      <path d="M60 12 L60 26 M50 15 L54 27 M70 15 L66 27" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <!-- Cheek Stripes -->
      <path d="M22 38 L32 40 M20 46 L30 46 M100 38 L90 40 M102 46 L92 46" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Cat Muzzle -->
      <ellipse cx="52" cy="54" rx="13" ry="9" fill="url(#catMuzzle)"/>
      <ellipse cx="68" cy="54" rx="13" ry="9" fill="url(#catMuzzle)"/>

      <!-- Cat Nose -->
      <polygon points="56,48 64,48 60,53" fill="#f43f5e"/>

      <!-- Cat Mouth -->
      <path d="M60 53 L60 56 M52 56 C56 60 60 59 60 56 C60 59 64 60 68 56" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Cat Whiskers -->
      <path d="M38 52 L8 48 M36 56 L6 57 M38 60 L10 66" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M82 52 L112 48 M84 56 L114 57 M82 60 L110 66" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>

      <!-- Cat Eyes (Vibrant Emerald / Hazel) -->
      <!-- Left Eye -->
      <ellipse cx="44" cy="35" rx="7.5" ry="8" fill="#10b981"/>
      <ellipse cx="44" cy="35" rx="3.5" ry="7" fill="#0f172a"/> <!-- Slit Pupil -->
      <circle cx="41" cy="31" r="2.2" fill="#ffffff"/>
      <circle cx="46" cy="37" r="1" fill="#ffffff"/>

      <!-- Right Eye -->
      <ellipse cx="76" cy="35" rx="7.5" ry="8" fill="#10b981"/>
      <ellipse cx="76" cy="35" rx="3.5" ry="7" fill="#0f172a"/> <!-- Slit Pupil -->
      <circle cx="73" cy="31" r="2.2" fill="#ffffff"/>
      <circle cx="78" cy="37" r="1" fill="#ffffff"/>

      <!-- Cat Cheek Blush -->
      <ellipse cx="32" cy="50" rx="6" ry="3.5" fill="#f87171" fill-opacity="0.25"/>
      <ellipse cx="88" cy="50" rx="6" ry="3.5" fill="#f87171" fill-opacity="0.25"/>
    </g>
  </g>

  <!-- ==================== STETHOSCOPE FRAME ==================== -->
  <g id="stethoscope" >
    
    <!-- Top Earpieces / Binaural Tips -->
    <!-- Left Earpiece -->
    <ellipse cx="170" cy="58" rx="14" ry="9" transform="rotate(-25 170 58)" fill="url(#metalGrad)"/>
    <ellipse cx="166" cy="56" rx="9" ry="6" transform="rotate(-25 166 56)" fill="#00f59b"/>
    <!-- Right Earpiece -->
    <ellipse cx="342" cy="58" rx="14" ry="9" transform="rotate(25 342 58)" fill="url(#metalGrad)"/>
    <ellipse cx="346" cy="56" rx="9" ry="6" transform="rotate(25 346 56)" fill="#00f59b"/>

    <!-- Metallic Binaural Arch Tubes -->
    <path d="M172 64 C150 90 120 130 98 185 C70 255 85 330 135 385 C175 425 210 440 256 445" 
          fill="none" stroke="url(#stethGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <path d="M340 64 C362 90 392 130 414 185 C442 255 427 330 377 385 C337 425 302 440 256 445" 
          fill="none" stroke="url(#stethGrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Stethoscope Inner Light Sheen Tube -->
    <path d="M172 64 C150 90 120 130 98 185 C70 255 85 330 135 385 C175 425 210 440 256 445" 
          fill="none" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>

    <!-- Tubing Extension to Chestpiece Bell -->
    <path d="M256 445 C280 445 320 455 350 435 C375 418 395 380 415 395 C430 405 428 425 410 442 C385 465 335 475 285 465"
          fill="none" stroke="url(#stethGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M256 445 C280 445 320 455 350 435 C375 418 395 380 415 395 C430 405 428 425 410 442 C385 465 335 475 285 465"
          fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>

    <!-- Chestpiece / Bell Diaphragm (Bottom Right) -->
    <g id="bell" transform="translate(422, 420)">
      <!-- Outer Metal Ring -->
      <circle cx="0" cy="0" r="26" fill="url(#metalGrad)" stroke="#059669" stroke-width="3"/>
      <!-- Inner Diaphragm Green Ring -->
      <circle cx="0" cy="0" r="19" fill="url(#stethGrad)"/>
      <!-- Central Sensor Core -->
      <circle cx="0" cy="0" r="11" fill="url(#metalGrad)"/>
      <circle cx="-3" cy="-3" r="4" fill="#ffffff" fill-opacity="0.8"/>
    </g>

    <!-- ==================== CENTRAL HEART SHIELD ==================== -->
    <g id="heart" transform="translate(256, 375)">
      <!-- Outer Heart Glow/Border -->
      <path d="M0 55 C-60 10 -95 -25 -70 -65 C-50 -95 0 -75 0 -40 C0 -75 50 -95 70 -65 C95 -25 60 10 0 55 Z" 
            fill="url(#heartGrad)" stroke="#00f59b" stroke-width="6"/>
      
      <!-- Inner Heart Body -->
      <path d="M0 45 C-50 8 -78 -20 -58 -52 C-42 -76 0 -60 0 -32 C0 -60 42 -76 58 -52 C78 -20 50 8 0 45 Z" 
            fill="url(#heartInnerGrad)"/>
      
      <!-- Heart Glossy Highlight -->
      <path d="M-45 -48 C-35 -65 -10 -55 -6 -35 C-20 -40 -35 -40 -45 -48 Z" fill="#ffffff" fill-opacity="0.65"/>
      <circle cx="35" cy="-45" r="5" fill="#ffffff" fill-opacity="0.6"/>

      <!-- Medical Cross / Pulse inside Heart -->
      <path d="M-22 -8 L-10 -8 L-5 -20 L3 6 L9 -14 L14 -8 L22 -8" 
            fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>